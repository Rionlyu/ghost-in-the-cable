[project]
name = "ghost-in-the-cable"
version = "0.1.0"
description = "A one-query quantum repair-shop game, powered by real Qiskit circuits"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "qiskit>=2,<3", "numpy>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
